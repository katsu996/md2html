codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: "85...100"
  status:
    project:
      default:
        target: auto
        threshold: 2%
        base: auto
    patch:
      default:
        target: 90%
        threshold: 0%

flags:
  unit:
    paths:
      - src/

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

